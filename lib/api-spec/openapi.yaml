openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Home-Navi - Care Facility Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: residents
    description: Resident management
  - name: staff
    description: Staff management
  - name: handover-notes
    description: Shift handover notes
  - name: vitals
    description: Vital signs records
  - name: meals
    description: Meal records
  - name: weights
    description: Weight records
  - name: eliminations
    description: Elimination records
  - name: day-services
    description: Day service preparation
  - name: bath-reports
    description: Bathing reports
  - name: insurances
    description: Insurance records
  - name: dashboard
  - name: settings
    description: Dashboard summaries
  - name: service-types
    description: Visit service type master
  - name: route-sheets
    description: Route sheet (visit schedule)
  - name: shift-types
    description: Shift type master
  - name: shifts
    description: Staff shifts
  - name: resident-services
    description: Resident service contracts
  - name: route-sheet-templates
    description: Weekly route sheet templates
  - name: audit
    description: Audit (admin-only) views for route-sheet plan vs actual
  - name: transfer-requests
    description: Transfer payment requests management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ───────────────────────────────────────────────────
  /dashboard/today:
    get:
      operationId: getDashboardToday
      tags: [dashboard]
      summary: Today's summary - who needs vitals, meals, etc.
      responses:
        "200":
          description: Today's summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardToday"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Get all active alerts (vital re-checks, elimination warnings)
      responses:
        "200":
          description: Active alerts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAlerts"

  # ── Residents ───────────────────────────────────────────────────
  /residents:
    get:
      operationId: listResidents
      tags: [residents]
      summary: List all residents
      parameters:
        - name: visible_only
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of residents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resident"
    post:
      operationId: createResident
      tags: [residents]
      summary: Create a new resident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResidentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"

  /residents/{id}:
    get:
      operationId: getResident
      tags: [residents]
      summary: Get a resident by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
        "404":
          description: Not found
    patch:
      operationId: updateResident
      tags: [residents]
      summary: Update a resident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResidentBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
    delete:
      operationId: deleteResident
      tags: [residents]
      summary: Delete a resident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /residents/{id}/vital-thresholds:
    get:
      operationId: getResidentVitalThresholds
      tags: [residents]
      summary: Get per-resident vital thresholds (null = use global defaults)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-resident vital thresholds or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VitalThresholds"
                  - type: "null"
        "404":
          description: Not found
    put:
      operationId: updateResidentVitalThresholds
      tags: [residents]
      summary: Set per-resident vital thresholds (null to reset to global)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/VitalThresholds"
                - type: "null"
      responses:
        "200":
          description: Updated per-resident vital thresholds or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VitalThresholds"
                  - type: "null"
        "404":
          description: Not found

  /residents/{id}/health-summary:
    get:
      operationId: getResidentHealthSummary
      tags: [residents]
      summary: Get all health data for a resident (for health management screen)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentHealthSummary"

  # ── Staff ────────────────────────────────────────────────────────
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List all staff
      parameters:
        - name: visible_only
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"
    post:
      operationId: createStaff
      tags: [staff]
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"

  /staff/{id}:
    get:
      operationId: getStaff
      tags: [staff]
      summary: Get a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Update a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
    delete:
      operationId: deleteStaff
      tags: [staff]
      summary: Delete a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Handover Notes ───────────────────────────────────────────────
  /handover-notes:
    get:
      operationId: listHandoverNotes
      tags: [handover-notes]
      summary: List handover notes
      parameters:
        - name: resident_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: is_doctor_report
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: today_only
          in: query
          schema:
            type: boolean
        - name: year_month
          in: query
          schema:
            type: string
            description: "YYYY-MM format"
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of handover notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HandoverNote"
    post:
      operationId: createHandoverNote
      tags: [handover-notes]
      summary: Create a handover note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHandoverNoteBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverNote"

  /handover-notes/{id}:
    get:
      operationId: getHandoverNote
      tags: [handover-notes]
      summary: Get a handover note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Handover note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverNote"
    patch:
      operationId: updateHandoverNote
      tags: [handover-notes]
      summary: Update a handover note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHandoverNoteBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverNote"
    delete:
      operationId: deleteHandoverNote
      tags: [handover-notes]
      summary: Delete a handover note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Vitals ───────────────────────────────────────────────────────
  /vitals:
    get:
      operationId: listVitals
      tags: [vitals]
      summary: List vital records
      parameters:
        - name: resident_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: date
          in: query
          schema:
            type: ["string", "null"]
            description: Filter by date (YYYY-MM-DD). Omit for all records.
        - name: today_only
          in: query
          schema:
            type: boolean
            description: If true, only return today's records
      responses:
        "200":
          description: List of vital records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vital"
    post:
      operationId: createVital
      tags: [vitals]
      summary: Record vital signs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVitalBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vital"

  /vitals/{id}:
    patch:
      operationId: updateVital
      tags: [vitals]
      summary: Update a vital record (e.g. set recheck flag)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVitalBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vital"
    delete:
      operationId: deleteVital
      tags: [vitals]
      summary: Delete a vital record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vitals/today-status:
    get:
      operationId: getVitalsTodayStatus
      tags: [vitals]
      summary: Get today's vitals status for all residents (for dashboard)
      responses:
        "200":
          description: Today's vital status per resident
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResidentVitalStatus"

  # ── Meals ────────────────────────────────────────────────────────
  /meals:
    get:
      operationId: listMeals
      tags: [meals]
      summary: List meal records
      parameters:
        - name: resident_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: today_only
          in: query
          schema:
            type: boolean
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of meal records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meal"
    post:
      operationId: createMeal
      tags: [meals]
      summary: Record a meal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMealBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"

  /meals/{id}:
    patch:
      operationId: updateMeal
      tags: [meals]
      summary: Update a meal record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMealBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"
    delete:
      operationId: deleteMeal
      tags: [meals]
      summary: Delete a meal record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Weights ──────────────────────────────────────────────────────
  /weights:
    get:
      operationId: listWeights
      tags: [weights]
      summary: List weight records
      parameters:
        - name: resident_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: this_month
          in: query
          schema:
            type: boolean
            description: If true, only return this month's records
      responses:
        "200":
          description: List of weight records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Weight"
    post:
      operationId: createWeight
      tags: [weights]
      summary: Record weight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWeightBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weight"

  /weights/{id}:
    patch:
      operationId: updateWeight
      tags: [weights]
      summary: Update a weight record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWeightBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weight"
    delete:
      operationId: deleteWeight
      tags: [weights]
      summary: Delete a weight record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /weights/monthly-status:
    get:
      operationId: getWeightsMonthlyStatus
      tags: [weights]
      summary: Get this month's weight status for all residents
      responses:
        "200":
          description: Monthly weight status per resident
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResidentWeightStatus"

  # ── Eliminations ─────────────────────────────────────────────────
  /eliminations:
    get:
      operationId: listEliminations
      tags: [eliminations]
      summary: List elimination records
      parameters:
        - name: resident_id
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of elimination records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Elimination"
    post:
      operationId: createElimination
      tags: [eliminations]
      summary: Record elimination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEliminationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Elimination"

  /eliminations/{id}:
    delete:
      operationId: deleteElimination
      tags: [eliminations]
      summary: Delete an elimination record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /eliminations/round-status:
    get:
      operationId: getEliminationRoundStatus
      tags: [eliminations]
      summary: Get current round check status for all residents
      responses:
        "200":
          description: Round status per resident
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResidentEliminationStatus"

  /eliminations/rounds/check:
    post:
      operationId: checkEliminationRound
      tags: [eliminations]
      summary: Mark a resident as checked in current round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckEliminationRoundBody"
      responses:
        "200":
          description: Round check recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /eliminations/rounds/reset:
    post:
      operationId: resetEliminationRound
      tags: [eliminations]
      summary: Reset all round checks (start a new round)
      responses:
        "200":
          description: Round reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ── Day Services ─────────────────────────────────────────────────
  /day-services:
    get:
      operationId: listDayServices
      tags: [day-services]
      summary: List day service records
      parameters:
        - name: day_of_week
          in: query
          schema:
            type: ["string", "null"]
            description: Filter by day (月/火/水/木/金/土/日)
        - name: resident_id
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of day service records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DayService"
    post:
      operationId: createDayService
      tags: [day-services]
      summary: Create a day service record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDayServiceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayService"

  /day-services/{id}:
    patch:
      operationId: updateDayService
      tags: [day-services]
      summary: Update a day service record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDayServiceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayService"
    delete:
      operationId: deleteDayService
      tags: [day-services]
      summary: Delete a day service record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /day-services/{id}/toggle-prepared:
    post:
      operationId: toggleDayServicePrepared
      tags: [day-services]
      summary: Toggle the prepared/collected status for a day service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayService"

  # ── Bath Reports ─────────────────────────────────────────────────
  /bath-reports:
    get:
      operationId: listBathReports
      tags: [bath-reports]
      summary: List bath reports
      parameters:
        - name: resident_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: today_only
          in: query
          schema:
            type: boolean
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of bath reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BathReport"
    post:
      operationId: createBathReport
      tags: [bath-reports]
      summary: Create a bath report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBathReportBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BathReport"

  /bath-reports/{id}:
    patch:
      operationId: updateBathReport
      tags: [bath-reports]
      summary: Update a bath report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBathReportBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BathReport"
    delete:
      operationId: deleteBathReport
      tags: [bath-reports]
      summary: Delete a bath report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Insurances ───────────────────────────────────────────────────
  /insurances:
    get:
      operationId: listInsurances
      tags: [insurances]
      summary: List insurance records for a resident
      parameters:
        - name: resident_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of insurance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insurance"
    post:
      operationId: createInsurance
      tags: [insurances]
      summary: Create an insurance record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInsuranceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insurance"

  /insurances/{id}:
    patch:
      operationId: updateInsurance
      tags: [insurances]
      summary: Update an insurance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInsuranceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insurance"
    delete:
      operationId: deleteInsurance
      tags: [insurances]
      summary: Delete an insurance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
