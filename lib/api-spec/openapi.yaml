        - vitalsRecordedCount
        - vitalsNeedRecheckCount
        - mealsRecordedBreakfastCount
        - mealsRecordedLunchCount
        - mealsRecordedDinnerCount
        - recentHandoverNotes

    DashboardAlerts:
      type: object
      properties:
        vitalsNeedingRecheck:
          type: array
          items:
            $ref: "#/components/schemas/ResidentVitalStatus"
        eliminationNeedingAttention:
          type: array
          items:
            $ref: "#/components/schemas/ResidentEliminationStatus"
        weightsNotRecordedThisMonth:
          type: array
          items:
            $ref: "#/components/schemas/ResidentWeightStatus"
      required:
        - vitalsNeedingRecheck
        - eliminationNeedingAttention
        - weightsNotRecordedThisMonth

    # ── Settings ──────────────────────────────────────────────────
    ThresholdRange:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
      required: [min, max]

    VitalThresholds:
      type: object
      properties:
        temperature:
          $ref: "#/components/schemas/ThresholdRange"
        bpSystolic:
          $ref: "#/components/schemas/ThresholdRange"
        bpDiastolic:
          $ref: "#/components/schemas/ThresholdRange"
        pulse:
          $ref: "#/components/schemas/ThresholdRange"
        spo2:
          $ref: "#/components/schemas/ThresholdRange"
      required: [temperature, bpSystolic, bpDiastolic, pulse, spo2]
