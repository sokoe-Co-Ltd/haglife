          name: weekday
          required: true
          schema: { type: integer, minimum: 0, maximum: 6 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteSheetTemplateUpsert" }
      responses:
