          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: OK }

  # ── Audit (admin) ───────────────────────────────────────────────
  /audit/route-sheets/{date}:
    get:
      operationId: getAuditRouteSheet
      tags: [audit]
      summary: Plan vs actual view for a date (all cells incl. skipped)
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditRouteSheetResponse" }
  /audit/notifications/{date}:
    get:
      operationId: getAuditNotifications
      tags: [audit]
      summary: Ad-hoc service notifications for a date
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditNotificationsResponse" }
  /audit/notifications/{cellId}/accept:
    post:
      operationId: acceptAuditNotification
      tags: [audit]
      summary: Accept an ad-hoc notification (day_only or add_to_template)
      parameters:
        - in: path
          name: cellId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationAcceptRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationAcceptResponse" }
        "400": { description: Bad Request }
        "404": { description: Not Found }
  /audit/cells/{cellId}:
    get:
      operationId: getAuditCell
      tags: [audit]
      summary: Get a single audit cell (for direct-link detail page)
      parameters:
        - in: path
          name: cellId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditCellView" }
        "404": { description: Not Found }
  /audit/cells/{cellId}/unskip:
    post:
      operationId: unskipAuditCell
      tags: [audit]
      summary: Restore a skipped cell back to planned/done
      parameters:
        - in: path
          name: cellId
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnskipRequest" }
      responses:
        "200": { description: OK }
        "400": { description: Bad Request }
        "404": { description: Not Found }
  /audit/cells/{cellId}/skip-reason:
    post:
      operationId: updateAuditCellSkipReason
      tags: [audit]
      summary: Set or overwrite a cell's skipReason
      parameters:
        - in: path
          name: cellId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkipReasonUpdateRequest" }
      responses:
        "200": { description: OK }
        "400": { description: Bad Request }
        "404": { description: Not Found }
  /audit/cells/{cellId}/history:
    get:
      operationId: getAuditCellHistory
      tags: [audit]
      summary: Change history for a cell
      parameters:
        - in: path
          name: cellId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditCellHistoryResponse" }
  /audit/cells/{cellId}/note:
    post:
      operationId: updateAuditCellNote
      tags: [audit]
      summary: Set or overwrite a cell's modifiedNote
      parameters:
        - in: path
          name: cellId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpdateRequest" }
      responses:
        "200": { description: OK }
        "400": { description: Bad Request }
        "404": { description: Not Found }
    delete:
      operationId: clearAuditCellNote
      tags: [audit]
      summary: Clear the modifiedNote of a cell
      parameters:
        - in: path
          name: cellId
          required: true
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "404": { description: Not Found }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Resident ──────────────────────────────────────────────────
    Resident:
      type: object
      properties:
        id:
          type: integer
        roomNumber:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        lastNameKana:
          type: string
        firstNameKana:
          type: string
        lastNameRoman:
          type: ["string", "null"]
        firstNameRoman:
          type: ["string", "null"]
