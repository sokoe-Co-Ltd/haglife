              schema:
                type: array
                items: { $ref: "#/components/schemas/RouteSheetTemplate" }
  /route-sheet-templates/{weekday}:
    get:
      operationId: getRouteSheetTemplate
      tags: [route-sheet-templates]
      parameters:
