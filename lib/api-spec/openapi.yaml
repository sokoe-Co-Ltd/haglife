        moveInDate:
          type: ["string", "null"]
        characterNotes:
          type: ["string", "null"]
        clinic1:
          type: ["string", "null"]
        clinic2:
          type: ["string", "null"]
        medicalHistory:
          type: ["string", "null"]
        doctorInstructions:
          type: ["string", "null"]
        keyPersonName:
