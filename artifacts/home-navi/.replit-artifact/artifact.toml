kind = "web"
previewPath = "/"
title = "Home-Navi"
version = "1.0.0"
id = "artifacts/home-navi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22173

[services.development]
run = "pnpm --filter @workspace/home-navi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/home-navi", "run", "build" ]
publicDir = "artifacts/home-navi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22173"
BASE_PATH = "/"
